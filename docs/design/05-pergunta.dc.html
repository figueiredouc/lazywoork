<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Agent Inbox — pergunta do agente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1A1A1A}
button,textarea{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 380px; height: 760px; box-sizing: border-box; background: #FFF8D6; border: 2px solid #1A1A1A; border-radius: 20px; box-shadow: 4px 4px 0 #1A1A1A; overflow: hidden; display: flex; flex-direction: column; font-family: 'Figtree', system-ui, sans-serif; color: #1A1A1A">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 4px 16px">
    <a href="D-Lista.dc.html" style="height: 32px; padding: 0 12px 0 8px; border: 2px solid #1A1A1A; background: #FFFFFF; border-radius: 999px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; text-decoration: none; box-sizing: border-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Todos (3)
    </a>
    <div style="flex-grow: 1"></div>
    <div style="font-size: 12px; font-weight: 700; color: #555048">2 de 3</div>
  </div>

  <div style="flex-grow: 1; overflow: auto; padding: 12px 16px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 48px; height: 48px; border-radius: 14px; background: #9EE6FF; border: 2px solid #1A1A1A; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0">IW</div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.01em">ingest-worker</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #555048">main · separador 2 · há 1 min</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 800; background: #9EE6FF; border: 2px solid #1A1A1A; padding: 2px 10px; border-radius: 999px; align-self: flex-start">pergunta</div>
      <div style="background: #FFFFFF; border: 2px solid #1A1A1A; border-radius: 16px 16px 16px 4px; padding: 12px 14px; font-size: 15px; line-height: 1.45; font-weight: 600; box-shadow: 3px 3px 0 #1A1A1A">Encontrei duas formas de migrar a tabela de leituras. Qual preferes?</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <button style="min-height: 42px; padding: 8px 12px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; color: #1A1A1A; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; text-align: left; line-height: 1.35; box-shadow: 3px 3px 0 #1A1A1A">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; width: 22px; height: 22px; border: 2px solid #1A1A1A; border-radius: 6px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0; background: #9EE6FF">A</span>
        Migração incremental com ALTER e backfill em lotes
      </button>
      <button style="min-height: 42px; padding: 8px 12px; border: 2px solid #1A1A1A; border-radius: 14px; background: #FFFFFF; color: #1A1A1A; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; text-align: left; line-height: 1.35; box-shadow: 3px 3px 0 #1A1A1A">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; width: 22px; height: 22px; border: 2px solid #1A1A1A; border-radius: 6px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0; background: #9EE6FF">B</span>
        Recriar a tabela e reimportar os dados
      </button>
    </div>

    <div style="background: #FFFFFF; border: 2px solid #1A1A1A; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <label for="resp" style="font-size: 13px; font-weight: 800">Ou responde à tua maneira</label>
      <textarea id="resp" rows="3" style="font-size: 13px; line-height: 1.45; border: 2px solid #1A1A1A; border-radius: 10px; padding: 8px 10px; resize: none; color: #1A1A1A; background: #FFF8D6">A, mas faz backup da tabela antes.</textarea>
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
        <button style="height: 36px; padding: 0 16px; border: 2px solid #1A1A1A; border-radius: 999px; background: #FFD43B; color: #1A1A1A; font-size: 13px; font-weight: 800">Enviar</button>
        <a href="D-Contexto.dc.html" style="height: 36px; padding: 0 14px; border: 2px solid #1A1A1A; border-radius: 999px; background: #FFFFFF; color: #1A1A1A; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; text-decoration: none; box-sizing: border-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5"></path><path d="M12 19h8"></path></svg>
          Ir para o terminal
        </a>
      </div>
      <div style="font-size: 12px; color: #555048">A resposta é escrita na sessão do agente no iTerm2.</div>
    </div>
  </div>
</div>
</x-dc>

</html>
